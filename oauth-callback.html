<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071321"><title>COROS 연결</title><body style="margin:0;background:#071321;color:#f2f7fb;font:16px system-ui;display:grid;min-height:100vh;place-items:center"><main style="max-width:420px;padding:28px;text-align:center"><h2>COROS 계정 연결 중</h2><p id="msg" style="color:#9bb0c2">인증 결과를 확인하고 있습니다.</p></main><script>
(async()=>{const p=new URLSearchParams(location.search),code=p.get('code'),state=p.get('state'),saved=sessionStorage.getItem('coros_oauth_state'),verifier=sessionStorage.getItem('coros_pkce_verifier'),clientId=sessionStorage.getItem('coros_client_id'),redirectUri=location.origin+'/oauth-callback.html';const msg=document.getElementById('msg');try{if(!code||!state||state!==saved||!verifier||!clientId)throw Error('인증 정보가 일치하지 않습니다. 처음부터 다시 연결해 주세요.');const r=await fetch('/api/coros/token',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({grantType:'authorization_code',clientId,code,redirectUri,codeVerifier:verifier})});const t=await r.json();if(!r.ok||!t.access_token)throw Error(t.error_description||t.error||'토큰 교환에 실패했습니다.');sessionStorage.setItem('coros_access_token',t.access_token);if(t.refresh_token)sessionStorage.setItem('coros_refresh_token',t.refresh_token);sessionStorage.setItem('coros_token_expiry',String(Date.now()+(Number(t.expires_in)||2592000)*1000));sessionStorage.removeItem('coros_pkce_verifier');sessionStorage.removeItem('coros_oauth_state');location.replace('/?coros=connected');}catch(e){msg.textContent=e.message;}})();
</script></body></html>
